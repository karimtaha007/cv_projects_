<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320">
  <rect width="420" height="320" rx="18" fill="#5c6bc0"/>

  <!-- PCB board -->
  <rect x="90" y="70" width="240" height="180" rx="10" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- mounting holes -->
  <circle cx="108" cy="88" r="5" fill="#ffffff"/>
  <circle cx="312" cy="88" r="5" fill="#ffffff"/>
  <circle cx="108" cy="232" r="5" fill="#ffffff"/>
  <circle cx="312" cy="232" r="5" fill="#ffffff"/>

  <!-- central IC chip -->
  <rect x="165" y="120" width="90" height="80" rx="4" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="177" cy="132" r="3.5" fill="#ffffff"/>

  <!-- chip pins -->
  <line x1="165" y1="135" x2="145" y2="135" stroke="#ffffff" stroke-width="5"/>
  <line x1="165" y1="160" x2="145" y2="160" stroke="#ffffff" stroke-width="5"/>
  <line x1="165" y1="185" x2="145" y2="185" stroke="#ffffff" stroke-width="5"/>

  <line x1="255" y1="135" x2="275" y2="135" stroke="#ffffff" stroke-width="5"/>
  <line x1="255" y1="160" x2="275" y2="160" stroke="#ffffff" stroke-width="5"/>
  <line x1="255" y1="185" x2="275" y2="185" stroke="#ffffff" stroke-width="5"/>

  <line x1="185" y1="120" x2="185" y2="102" stroke="#ffffff" stroke-width="5"/>
  <line x1="210" y1="120" x2="210" y2="102" stroke="#ffffff" stroke-width="5"/>
  <line x1="235" y1="120" x2="235" y2="102" stroke="#ffffff" stroke-width="5"/>

  <line x1="185" y1="200" x2="185" y2="218" stroke="#ffffff" stroke-width="5"/>
  <line x1="210" y1="200" x2="210" y2="218" stroke="#ffffff" stroke-width="5"/>
  <line x1="235" y1="200" x2="235" y2="218" stroke="#ffffff" stroke-width="5"/>

  <!-- trace to a via / LED -->
  <circle cx="145" cy="135" r="4" fill="#ffffff"/>
  <circle cx="145" cy="185" r="4" fill="#ffffff"/>
  <circle cx="275" cy="160" r="4" fill="#ffffff"/>
  <circle cx="185" cy="102" r="4" fill="#ffffff"/>
  <circle cx="235" cy="218" r="4" fill="#ffffff"/>
</svg>